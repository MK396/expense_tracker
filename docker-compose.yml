services:
  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db_data:/app/data
    expose:
      - "8000"

  frontend:
    build: ./expense-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data: